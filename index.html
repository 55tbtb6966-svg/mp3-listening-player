<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light"><title>Listening Player A-Bリピート対応版</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f4f9;color:#17243b;margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{max-width:650px;margin:18px auto;background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 20px #14243a12}h1{font-size:23px;margin:0 0 14px}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:15px 8px;background:#e7eef9;color:#142c54;font-weight:650;touch-action:manipulation;cursor:pointer;min-height:52px}button:active{filter:brightness(.92)}button:disabled{opacity:.45}.pick{position:relative;display:block;background:#2157cb;color:white;text-align:center;padding:17px;border-radius:13px;font-weight:700;cursor:pointer;overflow:hidden;min-height:56px}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}#status{padding:12px;margin:10px 0;background:#f2f5fa;border-radius:10px;min-height:46px;overflow-wrap:anywhere;font-size:14px;line-height:1.5}#status.error{background:#fff1ef;color:#a42617}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.row{display:flex;align-items:center;gap:9px;margin:14px 0}.row button{flex:1}.primary{background:#2157cb;color:#fff;flex:1.5!important}#seek{width:100%;margin:14px 0;accent-color:#2157cb}.times{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:14px}select{padding:10px;border:1px solid #b5c4d8;border-radius:10px;background:white}.ab{background:#f2f6ff;border:1px solid #cbd9f5;border-radius:14px;padding:13px;margin-top:18px}.ab h2{font-size:17px;margin:0 0 9px}.abgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.abgrid button{font-size:14px}.abtimes{font-size:14px;line-height:1.8;margin:9px 0;font-variant-numeric:tabular-nums}.abstate{font-size:13px;color:#405575;margin:8px 0 0}.ab .active{background:#2157cb;color:white}.note{font-size:13px;color:#56647a;line-height:1.65;margin-top:22px}label.caption{display:block;margin-top:20px;font-weight:650}@media(max-width:380px){main{padding:15px}.grid{gap:6px}button{padding:12px 4px;font-size:14px}}
</style></head><body><main><h1>🎧 Listening Player</h1><label class="pick">📁 MP3を選択<input id="file" type="file" accept=".mp3,audio/mpeg,audio/mp4,.m4a,audio/*" aria-label="端末からMP3を選択"></label><div id="status" role="status" aria-live="polite">音源は未選択です。上のボタンから選択してください。</div><audio id="audio" preload="metadata" playsinline></audio><label class="caption" for="seek">再生位置</label><input id="seek" type="range" min="0" max="100" step="0.01" value="0" disabled><div class="times"><span id="current">0:00.0</span><span id="duration">0:00.0</span></div><div class="grid"><button data-jump="-0.5" disabled>−0.5秒</button><button data-jump="-1" disabled>−1秒</button><button data-jump="-2" disabled>−2秒</button><button data-jump="-3" disabled>−3秒</button><button data-jump="-5" disabled>−5秒</button><button data-jump="-10" disabled>−10秒</button></div><div class="row"><button id="back" disabled>↶ 1秒</button><button class="primary" id="play" disabled>▶ 再生</button><button id="forward" disabled>1秒 ↷</button></div><div class="row"><label for="speed">再生速度</label><select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></div><section class="ab"><h2>🔁 A–B区間リピート</h2><div class="abgrid"><button id="setA" disabled>ここをAに</button><button id="setB" disabled>ここをBに</button><button id="clearAB" disabled>解除</button></div><div class="abtimes">開始 A：<strong id="atime">未設定</strong>　終了 B：<strong id="btime">未設定</strong></div><div class="abgrid"><button id="toggleAB" disabled>リピート OFF</button><button id="gotoA" disabled>Aから再生</button><button id="clearPoints" disabled>A・Bを消去</button></div><div id="abstate" class="abstate" aria-live="polite">AとBを指定すると区間リピートを開始できます。</div></section><p class="note">iPhoneではSafariからこのページを開き、「MP3を選択」→「ファイルを選択」→「このiPhone内」または「iCloud Drive」で音源を選びます。音源は端末内だけで再生し、アップロード・履歴保存はしません。Windowsでは Space＝再生/停止、←＝1秒戻る、Shift＋←＝0.5秒戻る、A/Bキー＝区間指定。</p></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),a=$('#audio'),f=$('#file'),status=$('#status'),seek=$('#seek'),current=$('#current'),duration=$('#duration'),play=$('#play'),speed=$('#speed');let objectURL=null,ready=false,loadToken=0,pointA=null,pointB=null,abEnabled=false;const fmt=n=>Number.isFinite(n)?`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}.${Math.floor(n%1*10)}`:'0:00.0';function message(s,error=false){status.textContent=s;status.classList.toggle('error',error)}function controls(on){ready=on;document.querySelectorAll('button').forEach(b=>b.disabled=!on);seek.disabled=!on;updateAB()}function updateAB(){const valid=pointA!==null&&pointB!==null&&pointB>pointA;$('#atime').textContent=pointA===null?'未設定':fmt(pointA);$('#btime').textContent=pointB===null?'未設定':fmt(pointB);$('#toggleAB').disabled=!ready||!valid;$('#gotoA').disabled=!ready||pointA===null;$('#toggleAB').textContent=abEnabled?'リピート ON':'リピート OFF';$('#toggleAB').classList.toggle('active',abEnabled);$('#abstate').textContent=abEnabled?'A〜Bを繰り返し再生中':valid?'A〜Bを設定済み。リピートOFFです。':'AとBを指定すると区間リピートを開始できます。'}function resetAB(){pointA=null;pointB=null;abEnabled=false;updateAB()}function checkAB(){if(!ready||!abEnabled||pointA===null||pointB===null||pointB<=pointA)return;if(a.currentTime>=pointB||a.currentTime<pointA){a.currentTime=pointA}}function update(){current.textContent=fmt(a.currentTime);duration.textContent=fmt(a.duration);seek.max=Number.isFinite(a.duration)?String(a.duration):'0';if(document.activeElement!==seek)seek.value=String(a.currentTime||0);play.textContent=a.paused?'▶ 再生':'Ⅱ 一時停止'}function jump(n){if(!ready)return;try{a.currentTime=Math.max(0,Math.min(Number.isFinite(a.duration)?a.duration:Infinity,a.currentTime+n));update()}catch(e){message('移動できません: '+e.message,true)}}
f.addEventListener('change',()=>{const file=f.files&&f.files[0];if(!file)return;const token=++loadToken;resetAB();controls(false);a.pause();a.removeAttribute('src');a.load();if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}message('読み込み中: '+file.name);try{objectURL=URL.createObjectURL(file);a.src=objectURL;a.load();a.playbackRate=Number(speed.value);const timeout=setTimeout(()=>{if(token===loadToken&&!ready)message('読み込みに時間がかかっています。MP3がiPhoneにダウンロード済みか確認してください。')},10000);const loaded=()=>{if(token!==loadToken)return;clearTimeout(timeout);controls(true);message('読み込み完了: '+file.name+'（'+fmt(a.duration)+'） 再生ボタンを押してください。');update()};const failed=()=>{if(token!==loadToken)return;clearTimeout(timeout);controls(false);message('読み込みに失敗しました。MP3形式か、ファイルが端末にダウンロード済みか確認してください。Safariで開き直す方法もお試しください。',true)};a.addEventListener('loadedmetadata',loaded,{once:true});a.addEventListener('error',failed,{once:true});}catch(e){message('ファイルを開けません: '+e.message,true)}finally{f.value=''}update()});
$('#setA').onclick=()=>{pointA=a.currentTime;if(pointB!==null&&pointB<=pointA){pointB=null;abEnabled=false}updateAB()};$('#setB').onclick=()=>{if(pointA===null){message('先にA地点を設定してください。',true);return}if(a.currentTime<=pointA){message('B地点はA地点より後に指定してください。',true);return}pointB=a.currentTime;abEnabled=true;a.currentTime=pointA;updateAB()};$('#toggleAB').onclick=()=>{abEnabled=!abEnabled;if(abEnabled)a.currentTime=pointA;updateAB()};$('#gotoA').onclick=async()=>{if(pointA===null)return;a.currentTime=pointA;try{await a.play()}catch(e){message('再生できません: '+e.message,true)}};$('#clearAB').onclick=()=>{abEnabled=false;updateAB()};$('#clearPoints').onclick=resetAB;document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>jump(Number(b.dataset.jump))));$('#back').onclick=()=>jump(-1);$('#forward').onclick=()=>jump(1);play.onclick=async()=>{if(!ready)return;if(a.paused){try{await a.play()}catch(e){message('再生できません: '+e.message,true)}}else a.pause();update()};speed.onchange=()=>a.playbackRate=Number(speed.value);seek.oninput=()=>{if(ready){try{a.currentTime=Number(seek.value)}catch(e){}}};['timeupdate','durationchange','play','pause','ended','seeked'].forEach(ev=>a.addEventListener(ev,update));a.addEventListener('timeupdate',checkAB);a.addEventListener('seeked',checkAB);document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();play.click()}else if(e.code==='ArrowLeft'){e.preventDefault();jump(e.shiftKey?-.5:-1)}else if(e.code==='ArrowRight'){e.preventDefault();jump(1)}else if(e.key.toLowerCase()==='a'){e.preventDefault();$('#setA').click()}else if(e.key.toLowerCase()==='b'){e.preventDefault();$('#setB').click()}});window.addEventListener('pagehide',e=>{if(!e.persisted){a.pause();if(objectURL)URL.revokeObjectURL(objectURL)}});controls(false);update()})();
</script></body></html>
